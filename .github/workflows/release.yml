name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
            executable: ns2pro-bridge
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            executable: ns2pro-bridge
          - rid: win-x64
            os: windows-latest
            executable: ns2pro-bridge.exe
    runs-on: ${{ matrix.os }}
    env:
      # Tags name releases; a manual dry run uses the commit, since branch names may contain '/'.
      LABEL: ${{ github.ref_type == 'tag' && github.ref_name || format('dryrun-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release -p ns2pro-bridge
      - name: Name single executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $extension = if ('${{ matrix.rid }}' -eq 'win-x64') { '.exe' } else { '' }
          Copy-Item 'target/release/${{ matrix.executable }}' "artifacts/ns2pro-bridge-${{ env.LABEL }}-${{ matrix.rid }}$extension"
      - uses: actions/upload-artifact@v7
        with:
          name: ns2pro-bridge-${{ env.LABEL }}-${{ matrix.rid }}
          path: artifacts/*
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --generate-notes
          fi

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout bridge
        uses: actions/checkout@v6
        with:
          path: src

      - name: Checkout VIIPER
        uses: actions/checkout@v6
        with:
          repository: Cookiekira/VIIPER
          ref: main
          path: viiper

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: viiper/go.mod

      - name: Publish
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "publish-output"
          New-Item -ItemType Directory -Force $publishDir | Out-Null
          dotnet publish src\Ns2Pro.BleBridge.csproj -c Release -r win-x64 "-p:ViiperSourceRoot=$env:GITHUB_WORKSPACE\viiper" -p:ContinuousIntegrationBuild=true "-p:PublishDir=$publishDir\"

      - name: Prepare artifact
        shell: pwsh
        run: |
          $publishExe = "publish-output\Ns2Pro.BleBridge.exe"
          $artifactExe = "artifacts\Ns2Pro.BleBridge-${{ github.ref_name }}-win-x64.exe"

          if (-not (Test-Path $publishExe)) {
            throw "Published executable was not found: $publishExe"
          }

          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $publishExe $artifactExe

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ns2Pro.BleBridge-${{ github.ref_name }}-win-x64
          path: artifacts/Ns2Pro.BleBridge-${{ github.ref_name }}-win-x64.exe
          if-no-files-found: error
          archive: false

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ASSET_PATH: artifacts\Ns2Pro.BleBridge-${{ github.ref_name }}-win-x64.exe
        run: |
          gh release view $env:TAG_NAME --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload $env:TAG_NAME $env:ASSET_PATH --repo $env:GITHUB_REPOSITORY --clobber
          }
          else {
            gh release create $env:TAG_NAME $env:ASSET_PATH --repo $env:GITHUB_REPOSITORY --generate-notes
          }

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/Cookiekira/ns2pro-bridge"

[workspace.dependencies]
ns2pro-proto = { path = "crates/ns2pro-proto", version = "0.3.0" }
ns2pro-usb = { path = "crates/ns2pro-usb", version = "0.3.0" }

aes = "0.9"
libc = "0.2"
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
futures = "0.3"
getrandom = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "rt", "sync", "time", "net", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1"
windows = "0.62"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
